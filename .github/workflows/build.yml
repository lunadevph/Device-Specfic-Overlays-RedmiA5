name: Build Overlays

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "SDK_ANDROID_JAR=$(find $ANDROID_HOME/platforms -name android.jar | head -1)" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Generate build number
        run: |
          git fetch --tags
          LAST=$(git tag -l 'github-automated-build-*' | sed 's/github-automated-build-//' | sort -n | tail -1)
          if [ -z "$LAST" ]; then
            NEXT=1
          else
            NEXT=$((10#$LAST + 1))
          fi
          BUILD_NUM=$(printf "%010d" $NEXT)
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          echo "RELEASE_TAG=github-automated-build-$BUILD_NUM" >> $GITHUB_ENV

      - name: Build Overlay-Redmi-A5-Core
        run: |
          mkdir -p core-build
          aapt2 compile \
            --dir Overlay-Redmi-A5-Core/res \
            -o core-build/resources.zip
          aapt2 link \
            --manifest Overlay-Redmi-A5-Core/AndroidManifest.xml \
            -I $SDK_ANDROID_JAR \
            -o core-build/overlay-serenity.apk \
            core-build/resources.zip

      - name: Build Overlay-RedmiA5-SystemUI
        run: |
          mkdir -p systemui-build
          aapt2 compile \
            --dir Overlay-RedmiA5-SystemUI/res \
            -o systemui-build/resources.zip
          aapt2 link \
            --manifest Overlay-RedmiA5-SystemUI/AndroidManifest.xml \
            -I $SDK_ANDROID_JAR \
            -o systemui-build/overlay-serenity-systemui.apk \
            systemui-build/resources.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Automated Build ${{ env.BUILD_NUM }}
          body: |
            Automated build from commit ${{ github.sha }}

            **Overlay-Redmi-A5-Core** — `treble-overlay-xiaomi-redmia5`
            **Overlay-RedmiA5-SystemUI** — `treble-overlay-xiaomi-redmia5-systemui`
          files: |
            core-build/overlay-serenity.apk
            systemui-build/overlay-serenity-systemui.apk
          generate_release_notes: false
          make_latest: false