name: Build Overlays

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "SDK_ANDROID_JAR=$(find $ANDROID_HOME/platforms -name android.jar | head -1)" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Generate release tag
        run: |
          DATE_TAG=$(date +'%m-%d-%y')
          echo "RELEASE_TAG=github-automated-build-$DATE_TAG" >> $GITHUB_ENV
          echo "RELEASE_DATE=$(date +'%m/%d/%y')" >> $GITHUB_ENV

      - name: Build Overlay-Redmi-A5-Core
        run: |
          mkdir -p core-build
          aapt2 compile \
            --dir Overlay-Redmi-A5-Core/res \
            -o core-build/resources.zip
          aapt2 link \
            --manifest Overlay-Redmi-A5-Core/AndroidManifest.xml \
            -I $SDK_ANDROID_JAR \
            -o core-build/overlay-serenity.apk \
            core-build/resources.zip

      - name: Build Overlay-RedmiA5-SystemUI
        run: |
          mkdir -p systemui-build
          aapt2 compile \
            --dir Overlay-RedmiA5-SystemUI/res \
            -o systemui-build/resources.zip
          aapt2 link \
            --manifest Overlay-RedmiA5-SystemUI/AndroidManifest.xml \
            -I $SDK_ANDROID_JAR \
            -o systemui-build/overlay-serenity-systemui.apk \
            systemui-build/resources.zip

      - name: Build Magisk module
        run: |
          mkdir -p out
          cp core-build/overlay-serenity.apk out/
          cp systemui-build/overlay-serenity-systemui.apk out/
          bash build-magisk-module.sh

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            core-build/overlay-serenity.apk \
            systemui-build/overlay-serenity-systemui.apk \
            out/serenity-overlays.zip \
            --title "Overlays for Redmi A5/POCO C71 (serenity) — $RELEASE_DATE" \
            --notes "Automated build from commit ${{ github.sha }}"